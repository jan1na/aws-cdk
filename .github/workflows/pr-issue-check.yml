name: PR Issue Reference Check
on:
  pull_request:
    types: [opened, edited, reopened]

jobs:
  check-issue-reference:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install type dependencies
        run: yarn install --frozen-lockfile
      - name: Compile TypeScript
        run: npx tsc --project scripts/tsconfig.pr-issue-check.json
      - name: Check PR description for issue reference
        uses: actions/github-script@v9
        with:
          script: |
            const { prIssueCheck } = require('./scripts/pr-issue-check.js');
            await prIssueCheck({ github, context, core });
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-issue-check-result
          path: pr-issue-check-result.json
          if-no-files-found: ignore
